<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Application dashboard</title>
  </head>
  <body>
    <main id="dashboard" class="workspace" hidden>

        <div class="actions"><img id="logo" width="36" height="36" alt="" hidden /><strong id="brand"></strong></div>

      </section>
    </main>
    <script type="module" src="/src/oem.ts"></script>
