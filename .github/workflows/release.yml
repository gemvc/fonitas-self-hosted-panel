name: Publish self-hosted panel ZIP

on:
  push:
    tags: ['v*']

concurrency:
  group: self-hosted-release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$TAG" == "v$version" ]]
          [[ "$(node -p 'require("./package.json").version')" == "$version" ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package panel at the archive root
        run: |
          cp LICENSE dist/LICENSE
          (cd dist && zip -qr ../fonitas-self-hosted-panel.zip .)
          unzip -tq fonitas-self-hosted-panel.zip
      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          asset=fonitas-self-hosted-panel.zip
          if status="$(gh release view "$TAG" --json isDraft,assets --jq '[.isDraft, any(.assets[]; .name == "fonitas-self-hosted-panel.zip")] | @tsv')"; then
            if [[ "$status" == $'false\ttrue' ]]; then
              exit 0
            fi
            if [[ "$status" == false* ]]; then
              echo "This tag was published without its ZIP asset." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$TAG" "$asset" --clobber
          gh release edit "$TAG" --draft=false
