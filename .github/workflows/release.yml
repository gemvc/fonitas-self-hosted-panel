name: Publish self-hosted panel ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version and release commit
        id: version
        shell: bash
        run: |
          tag="v$(bash scripts/resolve-release-version.sh)"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/tags/$tag" ]]; then
            git merge-base --is-ancestor HEAD origin/main
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Release from main or push a tag that matches the resolved version."
            exit 1
          fi

          printf 'tag=%s\ncommit=%s\n' "$tag" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: self-hosted-release-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Apply the resolved version to the build
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';

          const version = process.env.TAG.slice(1);
          const baseVersion = readFileSync('VERSION', 'utf8').trim();
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const pkg = read('package.json');
          const lock = read('package-lock.json');
          if ([pkg.version, lock.version, lock.packages['']?.version].some(value => value !== baseVersion)) {
            throw new Error('The base versions in VERSION, package.json and package-lock.json must agree.');
          }
          pkg.version = lock.version = lock.packages[''].version = version;
          writeFileSync('VERSION', version + '\n');
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          JS
      - run: npm ci
      - run: npm run build
      - name: Package panel at the archive root
        run: |
          cp LICENSE VERSION dist/
          (cd dist && zip -qr ../fonitas-self-hosted-panel.zip .)
          unzip -tq fonitas-self-hosted-panel.zip
      - name: Retain the generated static ZIP
        uses: actions/upload-artifact@v7
        with:
          path: fonitas-self-hosted-panel.zip
          archive: false
          if-no-files-found: error
          overwrite: true
      - name: Build and sign OEM release
        env:
          OEM_RELEASE_SIGNING_KEY: ${{ secrets.OEM_RELEASE_SIGNING_KEY }}
        run: |
          npm run build:oem
          (cd dist-oem && zip -qD ../panel-oem.zip oem.html assets/*)
          unzip -tq panel-oem.zip
          node installer/sign-release.mjs
      - name: Publish ZIP and OEM installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$RELEASE_COMMIT" ]]; then
              echo "$TAG already points to a different commit. Check the release history and resolve the tag collision before publishing."
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$RELEASE_COMMIT" --silent
          fi

          assets=(fonitas-self-hosted-panel.zip panel-oem.zip oem-release.json setup.php)
          if status="$(gh release view "$TAG" --json isDraft,assets --jq '[.isDraft, ((.assets | map(.name) | sort) == (["fonitas-self-hosted-panel.zip", "panel-oem.zip", "oem-release.json", "setup.php"] | sort))] | @tsv')"; then
            if [[ "$status" == $'false\ttrue' ]]; then
              exit 0
            fi
            if [[ "$status" == false* ]]; then
              echo "This tag was published without its expected release assets."
              exit 1
            fi
          else
            gh release create "$TAG" --verify-tag --generate-notes --draft
          fi
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release edit "$TAG" --draft=false
