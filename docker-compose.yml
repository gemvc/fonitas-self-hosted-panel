# Local development stack before push.
# Panel UI:     http://localhost:5173
# Customer API: http://localhost:8080/api/health
#
#   cp customer/.env.example customer/.env   # then edit and chmod 600
#   docker compose up
#   docker compose run --rm panel npm run typecheck
#   docker compose down

services:
  panel:
    image: node:24-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - panel_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Prefer a gitignored root `.env` / `.env.development.local` with VITE_ALLOW_LOCALHOST_ORIGINS=true.
      # Compose can also inject it for local Docker without committing the value:
      VITE_ALLOW_LOCALHOST_ORIGINS: "true"

  customer:
    image: php:8.2-cli-bookworm
    working_dir: /app
    volumes:
      - .:/app
    command: php -S 0.0.0.0:8080 -t customer/public customer/public/index.php
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      PANEL_ALLOW_LOCALHOST: "true"
    profiles:
      - customer

  preview:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4173:80"
    profiles:
      - preview

volumes:
  panel_node_modules:
